[tool.pytest.ini_options]
# Django settings module - use test settings with SQLite
DJANGO_SETTINGS_MODULE = "rowingstats.settings_test"

# Test discovery patterns
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Paths to search for tests
testpaths = ["tests", "rowing/tests.py", "blog/tests.py", "hrr/tests.py"]

# Additional options
addopts = "-v --tb=short --strict-markers -ra"

# Markers for categorizing tests
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# Minimum pytest version
minversion = "7.0"

# Filter warnings
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
